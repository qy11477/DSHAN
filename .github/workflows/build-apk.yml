name: Build DSHAN APK

# 云端编译 DSHAN（不占用手机资源）
# 用法：把这个文件放在 fork 仓库的 .github/workflows/build-apk.yml
# 触发：推送后自动跑，或在 Actions 页面点 Run workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 下载 nodejs-mobile 运行时（含 SHA-256 校验）
        shell: bash
        run: pwsh -NoProfile -File ./scripts/fetch-node.ps1

      - name: 安装 Android 平台的运行依赖
        shell: bash
        run: npm ci --prefix runtime --omit=dev --ignore-scripts --os=android --cpu=arm64 --libc=bionic

      - name: 打包 runtime.zip 进 assets
        shell: bash
        run: pwsh -NoProfile -File ./scripts/prepare-runtime.ps1

      - name: 编译 APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: DSHAN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
